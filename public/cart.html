<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Klein Shoppers</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
        }

        .container{

            max-width:1200px;

            margin:40px auto;

            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0 5px 20px rgba(0,0,0,.1);

        }

        table{

            width:100%;

            border-collapse:collapse;

        }

        th,td{

            padding:15px;

            border-bottom:1px solid #ddd;

            text-align:center;

        }

        th{

            background:#0d6efd;

            color:white;

        }

        img{

            width:80px;

            height:80px;

            object-fit:cover;

            border-radius:8px;

        }

        .qty-btn{

            width:35px;

            height:35px;

            border:none;

            cursor:pointer;

            background:#0d6efd;

            color:white;

            border-radius:5px;

            font-size:18px;

        }

        .remove{

            background:#dc3545;

            color:white;

            border:none;

            padding:10px 15px;

            border-radius:5px;

            cursor:pointer;

        }

        .summary{

            margin-top:30px;

            text-align:right;

            font-size:20px;

        }

        #checkout{

            margin-top:20px;

            padding:15px 35px;

            background:green;

            color:white;

            border:none;

            border-radius:5px;

            cursor:pointer;

            font-size:18px;

        }

    </style>

</head>

<body>

<div class="container">

<h1>Shopping Cart</h1>

<table>

<thead>

<tr>

<th>Image</th>

<th>Product</th>

<th>Price</th>

<th>Quantity</th>

<th>Total</th>

<th>Action</th>

</tr>

</thead>

<tbody id="cartBody">

</tbody>

</table>

<div class="summary">

<h2>

Grand Total:

UGX

<span id="grandTotal">

0

</span>

</h2>

<button id="checkout">

Proceed to Checkout

</button>

</div>

</div>

<script src="/js/cart.js"></script>

    <script src="/js/site-nav.js"></script>
</body>

</html>
