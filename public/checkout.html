<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Klein Shoppers</title>

<link rel="stylesheet" href="/css/style.css">

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    margin:0;
}

.container{

    max-width:900px;

    margin:40px auto;

    background:white;

    padding:35px;

    border-radius:10px;

    box-shadow:0 5px 20px rgba(0,0,0,.1);

}

label{

    display:block;

    margin-top:20px;

    margin-bottom:8px;

    font-weight:bold;

}

select{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

}

button{

    margin-top:30px;

    width:100%;

    padding:15px;

    border:none;

    border-radius:6px;

    background:#28a745;

    color:white;

    font-size:18px;

    cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h1>Checkout</h1>

<p>

Confirm your payment method to complete your purchase.

</p>

<div id="checkoutSummary"></div>

<label>

Payment Method

</label>

<select id="paymentMethod">

<option>

Cash on Delivery

</option>

<option>

MTN Mobile Money

</option>

<option>

Airtel Money

</option>

<option>

Visa / Mastercard

</option>

</select>

<button id="placeOrder">

Place Order

</button>

</div>

<script src="/js/checkout.js"></script>

    <script src="/js/site-nav.js"></script>
</body>

</html>
