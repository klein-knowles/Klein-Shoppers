<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist | Klein Shoppers</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="simple-page-header">
        <a href="/" class="brand-link">Klein Shoppers</a>
        <nav>
            <a href="/products.html">Products</a>
            <a href="/cart.html">Cart</a>
            <a href="/account.html">Account</a>
        </nav>
    </header>

    <main class="catalog-page">
        <section class="catalog-heading">
            <div>
                <p class="eyebrow">Saved items</p>
                <h1>My Wishlist</h1>
            </div>
            <a href="/products.html" class="secondary-link">Keep shopping</a>
        </section>

        <section id="wishlist" class="product-grid" aria-live="polite">
            <p class="catalog-message">Loading wishlist...</p>
        </section>
    </main>

    <script src="/js/wishlist.js"></script>
    <script src="/js/site-nav.js"></script>
</body>
</html>
