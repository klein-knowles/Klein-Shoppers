<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Login | Klein Shoppers</title>

<link rel="stylesheet" href="/css/style.css">

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
}

.container{
    width:420px;
    margin:70px auto;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#0d6efd;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:17px;
}

button:hover{
    background:#0b5ed7;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#0d6efd;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>Customer Login</h1>

<form id="loginForm">

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div class="register">

Don't have an account?

<a href="/register.html">

Create Account

</a>

</div>

</div>

<script src="/js/login.js"></script>

    <script src="/js/site-nav.js"></script>
</body>

</html>
