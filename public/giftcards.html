<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Cards | Klein Shoppers</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="simple-page-header">
        <a href="/" class="brand-link">Klein Shoppers</a>
        <nav>
            <a href="/">Home</a>
            <a href="/products.html">Shop</a>
            <a href="/cart.html">Cart</a>
            <a href="/login.html">Login</a>
        </nav>
    </header>

    <main class="catalog-page">
        <section class="catalog-heading">
            <div>
                <p class="eyebrow">Flexible gifting</p>
                <h1>Gift Cards</h1>
            </div>
            <a href="/products.html" class="secondary-link">Shop products</a>
        </section>

        <section class="gift-card-panel">
            <div class="tabs" role="tablist" aria-label="Gift card actions">
                <button class="tab-btn active" data-tab="create" type="button">Create</button>
                <button class="tab-btn" data-tab="check" type="button">Check Balance</button>
                <button class="tab-btn" data-tab="redeem" type="button">Redeem</button>
                <button class="tab-btn" data-tab="my-cards" type="button">My Cards</button>
            </div>

            <div id="message" class="message" style="display:none;"></div>

            <div id="tab-create" class="tab-content active">
                <form id="createForm" class="checkout-card">
                    <h2>Create Gift Card</h2>
                    <label>Amount (UGX)<input type="number" id="amount" min="1" step="1" required></label>
                    <label>Expiry
                        <select id="expiryDays">
                            <option value="30">30 days</option>
                            <option value="90">90 days</option>
                            <option value="180">180 days</option>
                            <option value="365" selected>365 days</option>
                            <option value="730">730 days</option>
                        </select>
                    </label>
                    <label>Recipient Email<input type="email" id="recipientEmail" required></label>
                    <label>Recipient Name<input type="text" id="recipientName" placeholder="Recipient name"></label>
                    <label>Personal Message<textarea id="giftMessage" rows="3" placeholder="Write a short message"></textarea></label>
                    <button type="submit" class="primary-action">Create Gift Card</button>
                </form>
            </div>

            <div id="tab-check" class="tab-content">
                <form id="checkForm" class="checkout-card">
                    <h2>Check Balance</h2>
                    <label>Gift Card Code<input type="text" id="checkCode" placeholder="GIFT-ABCD-1234-EFGH" required></label>
                    <button type="submit" class="primary-action">Check Balance</button>
                    <div id="cardInfo" style="display:none; margin-top:20px;"></div>
                </form>
            </div>

            <div id="tab-redeem" class="tab-content">
                <form id="redeemForm" class="checkout-card">
                    <h2>Redeem Gift Card</h2>
                    <label>Gift Card Code<input type="text" id="redeemCode" placeholder="GIFT-ABCD-1234-EFGH" required></label>
                    <label>Amount to Redeem (UGX)<input type="number" id="redeemAmount" min="1" step="1" required></label>
                    <button type="submit" class="primary-action">Redeem Now</button>
                </form>
            </div>

            <div id="tab-my-cards" class="tab-content">
                <section class="checkout-card">
                    <h2>My Gift Cards</h2>
                    <div id="myCardsList">
                        <p class="catalog-message">You do not have any gift cards yet.</p>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/site-nav.js"></script>
</body>
</html>
