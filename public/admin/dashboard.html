<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link
href="/admin/css/admin.css"
rel="stylesheet">

<link
href="/admin/css/dashboard.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="d-flex">

    <div id="sidebar"></div>

    <div class="flex-grow-1">

        <div id="topbar"></div>

        <div class="container-fluid mt-4">

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <h2 class="fw-bold">

                        Dashboard

                    </h2>

                    <small class="text-muted">

                        Klein Shoppers Analytics

                    </small>

                </div>

            </div>

            <!-- KPI Cards -->

            <div class="row mt-4">

                <div class="col-lg-3 col-md-6 mb-3">

                    <div class="dashboard-card revenue">

                        <div>

                            <small>Total Revenue</small>

                            <h3 id="revenue">

                                UGX 0

                            </h3>

                        </div>

                        <i class="bi bi-cash-stack"></i>

                    </div>

                </div>

                <div class="col-lg-3 col-md-6 mb-3">

                    <div class="dashboard-card orders">

                        <div>

                            <small>Total Orders</small>

                            <h3 id="orders">

                                0

                            </h3>

                        </div>

                        <i class="bi bi-cart-check"></i>

                    </div>

                </div>

                <div class="col-lg-3 col-md-6 mb-3">

                    <div class="dashboard-card customers">

                        <div>

                            <small>Customers</small>

                            <h3 id="customers">

                                0

                            </h3>

                        </div>

                        <i class="bi bi-people"></i>

                    </div>

                </div>

                <div class="col-lg-3 col-md-6 mb-3">

                    <div class="dashboard-card products">

                        <div>

                            <small>Products</small>

                            <h3 id="products">

                                0

                            </h3>

                        </div>

                        <i class="bi bi-box-seam"></i>

                    </div>

                </div>

            </div>

            <!-- Charts -->

            <div class="row">

                <div class="col-lg-8">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>

                                Monthly Revenue

                            </h5>

                            <canvas id="revenueChart"></canvas>

                        </div>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>

                                Best Selling Products

                            </h5>

                            <canvas id="bestChart"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Tables -->

            <div class="row mt-4">

                <div class="col-lg-7">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>

                                Recent Orders

                            </h5>

                            <table class="table">

                                <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Customer</th>

                                    <th>Total</th>

                                    <th>Status</th>

                                </tr>

                                </thead>

                                <tbody id="recentOrders">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

                <div class="col-lg-5">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h5>

                                Low Stock Products

                            </h5>

                            <table class="table">

                                <thead>

                                <tr>

                                    <th>Product</th>

                                    <th>Stock</th>

                                </tr>

                                </thead>

                                <tbody id="lowStock">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/admin/js/layout.js"></script>

<script src="/admin/js/dashboard.js"></script>

</body>

</html>
