<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sales Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="/admin/css/admin.css"
          rel="stylesheet">

    <link href="/admin/css/reports.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->
    <div id="sidebar"></div>

    <!-- Main -->
    <div class="flex-grow-1">

        <!-- Topbar -->
        <div id="topbar"></div>

        <div class="container-fluid mt-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        Sales Reports

                    </h2>

                    <small class="text-muted">

                        Sales & Revenue Analytics

                    </small>

                </div>

                <div>

                    <button
                        id="printBtn"
                        class="btn btn-outline-dark">

                        <i class="bi bi-printer"></i>

                        Print

                    </button>

                    <button
                        id="csvBtn"
                        class="btn btn-success">

                        <i class="bi bi-download"></i>

                        Export CSV

                    </button>

                </div>

            </div>

            <!-- Filter Card -->

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <div class="row">

                        <div class="col-md-3">

                            <label>

                                Start Date

                            </label>

                            <input

                                id="startDate"

                                type="date"

                                class="form-control">

                        </div>

                        <div class="col-md-3">

                            <label>

                                End Date

                            </label>

                            <input

                                id="endDate"

                                type="date"

                                class="form-control">

                        </div>

                        <div class="col-md-3">

                            <label>

                                Report Type

                            </label>

                            <select

                                id="reportType"

                                class="form-select">

                                <option value="daily">

                                    Daily

                                </option>

                                <option value="weekly">

                                    Weekly

                                </option>

                                <option value="monthly">

                                    Monthly

                                </option>

                                <option value="custom">

                                    Custom

                                </option>

                            </select>

                        </div>

                        <div class="col-md-3 d-flex align-items-end">

                            <button

                                id="loadReport"

                                class="btn btn-primary w-100">

                                <i class="bi bi-search"></i>

                                Generate Report

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- KPI Cards -->

            <div class="row mb-4">

                <div class="col-lg-4">

                    <div class="report-card revenue">

                        <small>

                            Total Revenue

                        </small>

                        <h2 id="revenue">

                            UGX 0

                        </h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="report-card orders">

                        <small>

                            Total Orders

                        </small>

                        <h2 id="orders">

                            0

                        </h2>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="report-card average">

                        <small>

                            Average Order

                        </small>

                        <h2 id="average">

                            UGX 0

                        </h2>

                    </div>

                </div>

            </div>

            <!-- Revenue Chart -->

            <div class="card shadow-sm mb-4">

                <div class="card-body">

                    <h5 class="mb-3">

                        Revenue Trend

                    </h5>

                    <canvas id="reportChart"
                            height="110">

                    </canvas>

                </div>

            </div>

            <!-- Orders Table -->

            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5>

                            Orders

                        </h5>

                        <input

                            id="searchOrder"

                            class="form-control w-25"

                            placeholder="Search Order">

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover">

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>Customer</th>

                                <th>Total</th>

                                <th>Status</th>

                                <th>Date</th>

                            </tr>

                            </thead>

                            <tbody id="ordersTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Layout -->

<script src="/admin/js/layout.js"></script>

<!-- Reports -->

<script src="/admin/js/reports.js"></script>

</body>

</html>
