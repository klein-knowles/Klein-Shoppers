<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Order Details</title>

<link rel="stylesheet" href="/admin/css/admin.css">

<style>

.customer-card{

    background:#fff;

    padding:20px;

    margin-bottom:25px;

    border-radius:8px;

    box-shadow:0 2px 10px rgba(0,0,0,.08);

}

.customer-card p{

    margin:8px 0;

}

table{

    width:100%;

    border-collapse:collapse;

}

th,td{

    padding:12px;

    border:1px solid #ddd;

    text-align:center;

}

th{

    background:#0d6efd;

    color:white;

}

.product-img{

    width:70px;

    height:70px;

    object-fit:cover;

    border-radius:8px;

}

.actions{

    margin-top:25px;

}

.actions select{

    padding:10px;

    margin-right:15px;

}

.actions button{

    padding:10px 18px;

    cursor:pointer;

}

</style>

</head>

<body>

<div class="wrapper">

<div id="sidebar"></div>

<div class="main">

<div id="topbar"></div>

<div class="content">

<h2>

Order Details

</h2>

<div

id="customerInfo"

class="customer-card">

</div>

<h3>

Products

</h3>

<table>

<thead>

<tr>

<th>Image</th>

<th>Product</th>

<th>Quantity</th>

<th>Price</th>

<th>Total</th>

</tr>

</thead>

<tbody id="itemsTable">

</tbody>

</table>

<div class="actions">

<label>

Order Status

</label>

<select id="status">

<option>Pending</option>

<option>Processing</option>

<option>Shipped</option>

<option>Delivered</option>

<option>Cancelled</option>

</select>

<button id="updateStatus">

Update Status

</button>

<br><br>

<label>

Payment Status

</label>

<select id="paymentStatus">

<option>Pending</option>

<option>Paid</option>

<option>Refunded</option>

</select>

<button id="updatePayment">

Update Payment

</button>

</div>

</div>

</div>

</div>

<script src="/admin/js/admin.js"></script>

<script src="/admin/js/order-details.js"></script>

</body>

</html>
