<!DOCTYPE html>
<html>

<head>
    <title>Add Product</title>
</head>

<body>

<h1>Add New Product</h1>

<form id="productForm" enctype="multipart/form-data">

    <input type="text" name="name" placeholder="Product Name" required><br><br>

    <textarea name="description" placeholder="Description"></textarea><br><br>

    <input type="text" name="category" placeholder="Category"><br><br>

    <input type="text" name="brand" placeholder="Brand"><br><br>

    <input type="number" name="price" placeholder="Price" required><br><br>

    <input type="number" name="stock" placeholder="Stock"><br><br>

    <input type="text" name="badge" placeholder="Badge"><br><br>

    <input type="number" step="0.1" name="rating" placeholder="Rating"><br><br>

    <input type="text" name="tags" placeholder="Tags"><br><br>

    <textarea name="specifications" placeholder="Specifications"></textarea><br><br>

    <input type="file" name="image" accept="image/*"><br><br>

    <button type="submit">
        Save Product
    </button>

</form>

<script>

const form = document.getElementById("productForm");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = new FormData(form);

    const response = await fetch("/admin/products/add",{

        method:"POST",

        body:data

    });

    const result = await response.json();

    alert(result.message);

});

</script>

</body>

</html>
