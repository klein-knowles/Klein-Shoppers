<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Category</title>

    <link rel="stylesheet" href="/admin/css/admin.css">

</head>

<body>

<div class="wrapper">

    <div id="sidebar"></div>

    <div class="main">

        <div id="topbar"></div>

        <div class="content">

            <h2>Edit Category</h2>

            <form id="editCategoryForm" enctype="multipart/form-data">

                <input
                    type="hidden"
                    id="categoryId">

                <div class="form-group">

                    <label>Category Name</label>

                    <input
                        type="text"
                        id="name"
                        required>

                </div>

                <div class="form-group">

                    <label>Description</label>

                    <textarea
                        id="description"
                        rows="5"></textarea>

                </div>

                <div class="form-group">

                    <label>Current Image</label>

                    <br>

                    <img
                        id="previewImage"
                        src=""
                        alt="Category Image"
                        style="
                            width:220px;
                            height:220px;
                            object-fit:cover;
                            border-radius:10px;
                            border:1px solid #ddd;
                        ">

                </div>

                <div class="form-group">

                    <label>Replace Image</label>

                    <input
                        type="file"
                        id="image"
                        accept=".jpg,.jpeg,.png,.gif,.webp">

                </div>

                <button type="submit">

                    Update Category

                </button>

            </form>

        </div>

    </div>

</div>

<script src="/admin/js/admin.js"></script>
<script src="/admin/js/edit-category.js"></script>

</body>

</html>
