<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Center - Admin Panel</title>
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="notification-container">
        <!-- Header -->
        <div class="notification-header">
            <div class="header-left">
                <h1><i class="fas fa-bell"></i> Notification Center</h1>
                <span class="notification-count" id="totalCount">0</span>
            </div>
            <div class="header-right">
                <button class="btn-mark-all" id="markAllRead">
                    <i class="fas fa-check-double"></i> Mark All as Read
                </button>
                <button class="btn-refresh" id="refreshNotifications">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="tab-btn active" data-filter="all">
                <i class="fas fa-list"></i> All
            </button>
            <button class="tab-btn" data-filter="orders">
                <i class="fas fa-shopping-cart"></i> Orders
            </button>
            <button class="tab-btn" data-filter="stock">
                <i class="fas fa-boxes"></i> Stock
            </button>
            <button class="tab-btn" data-filter="customers">
                <i class="fas fa-users"></i> Customers
            </button>
            <button class="tab-btn" data-filter="reviews">
                <i class="fas fa-star"></i> Reviews
            </button>
            <button class="tab-btn" data-filter="delivery">
                <i class="fas fa-truck"></i> Delivery
            </button>
        </div>

        <!-- Notification List -->
        <div class="notification-list" id="notificationList">
            <!-- Notifications will be dynamically inserted here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <i class="fas fa-bell-slash"></i>
            <h3>No Notifications</h3>
            <p>You're all caught up! No new notifications to display.</p>
        </div>

        <!-- Load More -->
        <div class="load-more-container" id="loadMoreContainer">
            <button class="btn-load-more" id="loadMoreBtn">Load More</button>
        </div>
    </div>

    <!-- Notification Detail Modal -->
    <div class="modal" id="notificationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Notification Details</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <script src="js/notifications.js"></script>
</body>
</html>
