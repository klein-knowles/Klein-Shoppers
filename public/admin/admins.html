<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Administrators</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link
href="/admin/css/admin.css"
rel="stylesheet">

</head>

<body class="bg-light">

<div class="d-flex">

    <!-- Sidebar -->

    <div id="sidebar"></div>

    <!-- Main -->

    <div class="flex-grow-1">

        <!-- Topbar -->

        <div id="topbar"></div>

        <div class="container-fluid mt-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2 class="fw-bold">

                        Administrators

                    </h2>

                    <small class="text-muted">

                        Manage system administrators

                    </small>

                </div>

                <button

                class="btn btn-primary"

                data-bs-toggle="modal"

                data-bs-target="#adminModal">

                    <i class="bi bi-plus-circle"></i>

                    New Administrator

                </button>

            </div>

            <!-- Cards -->

            <div class="row mb-4">

                <div class="col-lg-3">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h6>Total Admins</h6>

                            <h2 id="totalAdmins">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h6>Super Admins</h6>

                            <h2 id="superAdmins">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h6>Managers</h6>

                            <h2 id="managers">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="card shadow-sm">

                        <div class="card-body">

                            <h6>Staff</h6>

                            <h2 id="staff">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Search -->

            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="row mb-3">

                        <div class="col-md-4">

                            <input

                            id="search"

                            class="form-control"

                            placeholder="Search Administrator">

                        </div>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                            <tr>

                                <th>ID</th>

                                <th>Name</th>

                                <th>Email</th>

                                <th>Role</th>

                                <th>Status</th>

                                <th>Date</th>

                                <th width="250">

                                    Actions

                                </th>

                            </tr>

                            </thead>

                            <tbody id="adminTable">

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ========================= -->

<!-- Add/Edit Modal -->

<!-- ========================= -->

<div

class="modal fade"

id="adminModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>

Administrator

</h5>

<button

class="btn-close"

data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<input
type="hidden"
id="adminId">

<div class="mb-3">

<label>

Full Name

</label>

<input

id="full_name"

class="form-control">

</div>

<div class="mb-3">

<label>

Email

</label>

<input

id="email"

class="form-control">

</div>

<div class="mb-3">

<label>

Password

</label>

<input

id="password"

type="password"

class="form-control">

</div>

<div class="mb-3">

<label>

Role

</label>

<select

id="role"

class="form-select">

<option>

Super Admin

</option>

<option>

Manager

</option>

<option>

Staff

</option>

</select>

</div>

<div class="mb-3">

<label>

Status

</label>

<select

id="status"

class="form-select">

<option>

Active

</option>

<option>

Inactive

</option>

</select>

</div>

</div>

<div class="modal-footer">

<button

class="btn btn-secondary"

data-bs-dismiss="modal">

Close

</button>

<button

class="btn btn-primary"

id="saveAdmin">

Save

</button>

</div>

</div>

</div>

</div>

<!-- ========================= -->

<!-- Password Modal -->

<!-- ========================= -->

<div

class="modal fade"

id="passwordModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5>

Change Password

</h5>

</div>

<div class="modal-body">

<input

type="hidden"

id="passwordAdminId">

<input

id="newPassword"

type="password"

class="form-control"

placeholder="New Password">

</div>

<div class="modal-footer">

<button

class="btn btn-secondary"

data-bs-dismiss="modal">

Cancel

</button>

<button

class="btn btn-success"

id="savePassword">

Update

</button>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/admin/js/layout.js"></script>

<script src="/admin/js/admins.js"></script>

</body>

</html>
