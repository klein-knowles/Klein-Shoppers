<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Klein Shoppers</title>

<link rel="stylesheet" href="/css/style.css">

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;

}

.container{

    width:420px;
    margin:60px auto;
    background:#fff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);

}

h1{

    text-align:center;
    margin-bottom:30px;
    color:#0d6efd;

}

.form-group{

    margin-bottom:18px;

}

label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;

}

input{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;

}

button{

    width:100%;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:17px;

}

button:hover{

    background:#0b5ed7;

}

.login{

    text-align:center;
    margin-top:20px;

}

.login a{

    color:#0d6efd;
    text-decoration:none;

}

</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form id="registerForm">

<div class="form-group">

<label>First Name</label>

<input
type="text"
id="first_name"
required>

</div>

<div class="form-group">

<label>Last Name</label>

<input
type="text"
id="last_name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
required>

</div>

<div class="form-group">

<label>Phone</label>

<input
type="text"
id="phone">

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

<label>Confirm Password</label>

<input
type="password"
id="confirm_password"
required>

</div>

<button type="submit">

Create Account

</button>

</form>

<div class="login">

Already have an account?

<a href="/login.html">

Login

</a>

</div>

</div>

<script src="/js/register.js"></script>

    <script src="/js/site-nav.js"></script>
</body>

</html>
